<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1565c0; }
  body { font-family: "Times New Roman", Times, serif; color: #222; overflow: hidden; }
  /* same look as the HR Portal sign-in page */
  #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
            background: linear-gradient(160deg, #0d47a1 0%, #1565c0 55%, #1e88e5 100%); z-index: 2; transition: opacity .35s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  .card { background: #fff; width: 100%; max-width: 400px; padding: 34px 28px 26px; text-align: center; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .card img { width: 150px; height: auto; }
  h1 { color: #714beb; font-size: 30px; margin: 4px 0 6px; }
  p { margin: 6px 0; font-size: 16px; color: #555; }
  .spin { width: 34px; height: 34px; margin: 18px auto 6px; border: 4px solid #e3e3e3; border-top-color: #1565c0; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .btn { display: none; margin-top: 18px; padding: 13px; background: #1565c0; color: #fff; text-decoration: none; font-size: 18px; }
  .err { display: none; color: #c62828; font-size: 15px; margin-top: 12px; }
  .hint { display: none; text-align: left; font-size: 14px; color: #555; background: #f3f6fb; padding: 10px 12px; margin-top: 16px; }
  .hint b { color: #0d47a1; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #1565c0;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  function fail(text) {
    $('spin').style.display = 'none'; $('msg').textContent = '';
    $('err').textContent = text; $('err').style.display = 'block';
  }
  function showAddHelp() {
    $('spin').style.display = 'none';
    $('msg').textContent = 'Add this to your home screen first.';
    $('add').style.display = 'block';
  }
  /* the HR Portal link is kept in portal-link.txt (just the link, nothing else) */
  fetch('portal-link.txt', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var url = (t.match(/https:\/\/script\.google\.com\/\S+/) || [''])[0].replace(/\/a\/macros\/[^\/]+\/s\//, '/macros/s/').replace(/[\s'";]+$/, '');
    if (!url) return fail('The HR Portal link has not been added yet (portal-link.txt).');
    $('open').href = url;
    if (/[?&]add=1/.test(location.search) && !standalone) return showAddHelp();
    var app = $('app'), done = false;
    app.onload = function () { if (done) return; done = true; setTimeout(function () { $('splash').className = 'gone'; }, 300); };
    app.src = url;
    setTimeout(function () {                 // still not shown: offer to open it in the browser
      if (done) return;
      $('msg').textContent = 'This is taking longer than usual.';
      $('open').style.display = 'block';
    }, 15000);
  }).catch(function () { fail('Could not read portal-link.txt. Check that the file is uploaded.'); });
})();
</script>
